<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JINKAI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#f5f5f5}button{font:inherit}.wrap{max-width:900px;margin:auto;padding:16px}.title{text-align:center;font-size:32px;font-weight:800;margin:8px 0 4px}.sub{text-align:center;color:#aaa;margin-bottom:16px}.top{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#1c1c1f;border:1px solid #333;border-radius:14px;padding:14px}.name{font-size:20px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#29292d;border-radius:8px;padding:7px;text-align:center;font-size:13px}.bar{height:9px;background:#333;border-radius:9px;overflow:hidden;margin-top:8px}.hpbar{height:100%;background:#e85b5b}.arena{margin:12px 0}.log{height:150px;overflow:auto;background:#0b0b0c;border-radius:10px;padding:10px;font-size:13px;line-height:1.5}.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.card{background:#25252a;border:1px solid #555;border-radius:12px;padding:10px;text-align:left;cursor:pointer;min-height:110px;color:#fff}.card:hover{border-color:#aaa}.card.selected{border:2px solid #fff}.card .rank{font-size:11px;color:#aaa}.card .cname{font-weight:700;margin:4px 0}.card .desc{font-size:12px;color:#ccc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:10px 14px;background:#eee;color:#111;cursor:pointer}button.secondary{background:#333;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.start{display:flex;justify-content:center;gap:8px;margin:14px 0}.hidden{display:none!important}.notice{text-align:center;padding:14px;border-radius:12px;background:#242429;margin:12px 0;font-weight:700}.select-target{display:flex;gap:8px;margin:8px 0}.small{font-size:12px;color:#aaa}.footer{text-align:center;color:#777;font-size:11px;margin:18px 0}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode-card{background:#1c1c1f;border:1px solid #333;border-radius:14px;padding:16px;text-align:center;cursor:pointer}
.mode-card:hover{border-color:#aaa}
.mode-card .mtitle{font-weight:700;font-size:16px;margin-bottom:6px}
.mode-card .mdesc{font-size:12px;color:#aaa}
.online-row{display:flex;gap:8px;margin-top:10px}
.online-row input{flex:1;border-radius:10px;border:1px solid #444;background:#0b0b0c;color:#fff;padding:10px;font-size:15px}
.online-info{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#aaa;margin-bottom:6px}
.badge{background:#29292d;border-radius:8px;padding:3px 8px}
@media(max-width:650px){.top{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hand{grid-template-columns:repeat(2,1fr)}.card{min-height:100px}.title{font-size:27px}.mode-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">JINKAI</div>
  <div class="sub">カードを使って相手より高いスコアを目指せ</div>

  <div id="modeScreen" class="panel">
    <div class="notice">対戦相手を選んでください</div>
    <div class="mode-grid">
      <div class="mode-card" id="pickAi">
        <div class="mtitle">🤖 AI対戦</div>
        <div class="mdesc">CPUと1人で対戦します。</div>
      </div>
      <div class="mode-card" id="pickOnline">
        <div class="mtitle">🌐 オンライン対戦</div>
        <div class="mdesc">同じ合言葉を入力した相手と対戦します。</div>
      </div>
    </div>
  </div>

  <div id="startScreen" class="panel hidden">
    <div class="notice">AI対戦</div>
    <p class="small">まずはカードを選んで使い、HP・運・所持金を管理しながらCPUと対戦します。</p>
    <div class="start">
      <button id="startBtn">ゲームを開始</button>
      <button id="backFromStart" class="secondary">戻る</button>
    </div>
  </div>

  <div id="onlineScreen" class="panel hidden">
    <div class="notice">オンライン対戦</div>
    <p class="small">相手と同じ合言葉を入力してください。先に入力した方が部屋を作り、後の方が入室します。</p>
    <div class="online-row">
      <input id="passInput" type="text" placeholder="合言葉(例: sakura123)" maxlength="30">
      <button id="connectBtn">接続する</button>
    </div>
    <p class="small" id="onlineStatus"></p>
    <div class="start"><button id="backFromOnline" class="secondary">戻る</button></div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="online-info hidden" id="onlineInfo">
      <span>合言葉: <span class="badge" id="roomLabel"></span></span>
      <span id="sideLabel" class="badge"></span>
    </div>
    <div class="top">
      <div class="panel" id="playerPanel"></div>
      <div class="panel" id="enemyPanel"></div>
    </div>
    <div class="arena panel">
      <div><b>ターン <span id="turnNo">1</span></b> / <span id="turnOwnerLabel">あなたのターン</span></div>
      <div class="small" id="targetHint">カードを選んでください。</div>
      <div class="select-target">
        <button id="targetSelf" class="secondary">自分を対象</button>
        <button id="targetEnemy" class="secondary">相手を対象</button>
      </div>
      <div id="hand" class="hand"></div>
      <div class="actions">
        <button id="playBtn" disabled>選んだカードを使う</button>
        <button id="drawBtn" class="secondary">カードを引く</button>
        <button id="endBtn" class="secondary">ターン終了</button>
        <button id="restartBtn" class="secondary">最初から</button>
      </div>
    </div>
    <div class="panel">
      <b>ログ</b>
      <div id="log" class="log"></div>
    </div>
  </div>
  <div id="result" class="notice hidden"></div>
  <div class="footer">JINKAI prototype</div>
</div>
<script src="cards.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---- 共通ユーティリティ(AI対戦・オンライン対戦の両方で使う) ----------

  const clone = obj => JSON.parse(JSON.stringify(obj));

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeDeck() {
    return shuffle([...ALL_CARDS, ...ALL_CARDS]).map(clone);
  }

  function costText(c) {
    const x = c.cost || {};
    const a = [];
    if (x.hp) a.push('HP-' + x.hp);
    if (x.mp) a.push('MP-' + x.mp);
    if (x.gold) a.push('G-' + x.gold);
    return a.length ? a.join(' / ') : 'コストなし';
  }

  function effectText(c) {
    const e = c.effect || {};
    const a = [];
    if (e.hp) a.push(e.hp > 0 ? 'HP+' + e.hp : 'HP' + e.hp);
    if (e.mp) a.push(e.mp > 0 ? 'MP+' + e.mp : 'MP' + e.mp);
    if (e.gold) a.push(e.gold > 0 ? 'G+' + e.gold : 'G' + e.gold);
    if (e.luck) a.push(e.luck > 0 ? '運+' + e.luck : '運' + e.luck);
    if (c.applyStatus) a.push(c.applyStatus.join('・'));
    if (c.removeStatus) a.push('解除:' + c.removeStatus.join('・'));
    if (c.applyDisease) a.push('疾病:' + c.applyDisease);
    return a.join(' / ') || c.special || c.summon || '特殊効果';
  }

  function statusDiseaseText(p) {
    const statuses = (p.statuses || []).map(s => STATUS_NAMES[s] || s).join('・') || 'なし';
    const diseases = (p.diseases || []).map(d => DISEASE_NAMES[d] || d).join('・') || 'なし';
    return `状態: ${statuses} / 疾病: ${diseases}`;
  }

  function renderPlayerCard(p) {
    return `<div class="name">${escapeHtml(p.name)}</div>` +
      `<div class="bar"><div class="hpbar" style="width:${Math.max(0, Math.min(100, p.hp / p.maxHp * 100))}%"></div></div>` +
      `<div class="stats">` +
      `<div class="stat">HP<br><b>${Math.max(0, p.hp)}/${p.maxHp}</b></div>` +
      `<div class="stat">MP<br><b>${p.mp}</b></div>` +
      `<div class="stat">G<br><b>${p.gold}</b></div>` +
      `<div class="stat">運<br><b>${p.luck}</b></div>` +
      `</div><div class="small">${statusDiseaseText(p)}</div>`;
  }

  function renderHand(hand, selectedIndex, onPick, disabled) {
    const h = $('hand');
    h.innerHTML = '';
    hand.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'card' + (i === selectedIndex ? ' selected' : '');
      b.disabled = Boolean(disabled);
      b.innerHTML = `<div class="rank">${c.rank || 'normal'} / ${c.target || 'self'}</div>` +
        `<div class="cname">${escapeHtml(c.name)}</div>` +
        `<div class="desc">${escapeHtml(costText(c))}<br>${escapeHtml(effectText(c))}</div>`;
      b.onclick = () => onPick(i);
      h.appendChild(b);
    });
  }

  function showResult(text) {
    const r = $('result');
    r.classList.remove('hidden');
    r.textContent = text;
  }

  function hideResult() {
    $('result').classList.add('hidden');
  }

  function showScreen(id) {
    ['modeScreen', 'startScreen', 'onlineScreen', 'gameScreen'].forEach(s => {
      $(s).classList.toggle('hidden', s !== id);
    });
  }

  let mode = 'offline'; // 'offline' | 'online'

  // ============================================================
  // AI対戦(オフライン, CPU戦)
  // ============================================================

  let player, enemy, deck, hand, enemyHand, selectedIndex = -1, target = 'enemy', turn = 1, gameOver = false;

  const initialPlayer = () => ({ name: 'あなた', hp: 30, maxHp: 30, mp: 8, gold: 10, luck: 5, statuses: [], diseases: [], isDefeated: false });
  const initialEnemy = () => ({ name: 'CPU', hp: 30, maxHp: 30, mp: 8, gold: 10, luck: 5, statuses: [], diseases: [], isDefeated: false });

  function log(msg) {
    const el = $('log');
    el.innerHTML += '<div>・' + escapeHtml(msg) + '</div>';
    el.scrollTop = el.scrollHeight;
  }

  function drawOne() {
    if (deck.length === 0) { log('山札がなくなった。'); return false; }
    if (hand.length >= 5) { log('手札が5枚なので引けない。'); return false; }
    hand.push(deck.pop());
    return true;
  }

  function render() {
    $('onlineInfo').classList.add('hidden');
    $('turnOwnerLabel').textContent = 'あなたのターン';
    $('playerPanel').innerHTML = renderPlayerCard(player);
    $('enemyPanel').innerHTML = renderPlayerCard(enemy);
    $('turnNo').textContent = turn;
    renderHand(hand, selectedIndex, (i) => {
      selectedIndex = i;
      $('playBtn').disabled = false;
      render();
    }, gameOver);
    $('targetHint').textContent = '対象: ' + (target === 'self' ? '自分' : '相手');
    $('playBtn').disabled = selectedIndex < 0 || gameOver;
  }

  function finish() {
    if (gameOver) return;
    gameOver = true;
    if (player.hp <= 0 && enemy.hp <= 0) showResult('引き分け');
    else if (enemy.hp <= 0) showResult('勝利');
    else if (player.hp <= 0) showResult('敗北');
    else showResult('ゲーム終了');
    render();
  }

  function check() {
    if (player.hp <= 0) { player.hp = 0; finish(); return true; }
    if (enemy.hp <= 0) { enemy.hp = 0; finish(); return true; }
    return false;
  }

  function useCard() {
    if (gameOver || selectedIndex < 0) return;
    const card = hand[selectedIndex];
    let t = target === 'self' ? player : enemy;
    if (card.target === 'self') t = player;
    else if (card.target === 'enemy' || card.target === 'allEnemies') t = enemy;
    else if (card.target === 'all') t = target === 'self' ? player : enemy;
    const res = applyCardEffect(card, player, t);
    log(res.message);
    if (!res.success) return;
    hand.splice(selectedIndex, 1);
    selectedIndex = -1;
    check();
    render();
  }

  // AIの意思決定は script.js の selectCard() をそのまま利用する
  // (HPが低ければ回復、疾病があれば治療、運が低ければ運回復、
  //  それ以外は一番強い攻撃カードを選ぶ、というロジック)。
  function cpuTurn() {
    if (gameOver) return;
    if (!canAct(enemy)) { log('CPUは石化していて行動できない。'); return; }
    if (enemyHand.length === 0) return;

    enemy.hand = enemyHand; // selectCard() は player.hand を参照する
    const card = selectCard(enemy);
    if (!card) return;
    const idx = enemyHand.indexOf(card);
    if (idx < 0) return;
    cpuUse(idx);
  }

  function cpuUse(i) {
    const c = enemyHand[i];
    let t = enemy;
    if (c.target === 'enemy' || c.target === 'allEnemies') t = player;
    else if (c.target === 'all') t = player;
    const res = applyCardEffect(c, enemy, t);
    log('CPU: ' + res.message);
    if (res.success) enemyHand.splice(i, 1);
    if (enemyHand.length < 3) {
      for (let k = 0; k < 2 && enemyHand.length < 5; k++) {
        if (deck.length) enemyHand.push(deck.pop());
      }
    }
    check();
    render();
  }

  function endTurn() {
    if (gameOver) return;
    try { processPlayerTurnEnd(player); } catch (e) {}
    check();
    if (gameOver) return;
    turn++;
    if (deck.length) drawOne();
    if (canAct(enemy)) cpuTurn();
    else log('CPUは石化していて行動できない。');
    if (!gameOver) {
      try { processPlayerTurnEnd(enemy); } catch (e) {}
      check();
    }
    render();
  }

  function startAiGame() {
    mode = 'offline';
    player = initialPlayer();
    enemy = initialEnemy();
    deck = makeDeck();
    hand = [];
    enemyHand = [];
    selectedIndex = -1;
    target = 'enemy';
    turn = 1;
    gameOver = false;
    hideResult();
    $('log').innerHTML = '';
    for (let i = 0; i < 4; i++) drawOne();
    for (let i = 0; i < 4; i++) if (deck.length) enemyHand.push(deck.pop());
    $('restartBtn').textContent = '最初から';
    showScreen('gameScreen');
    log('AI対戦を開始した。');
    render();
  }

  // ============================================================
  // オンライン対戦(合言葉でPeerJSを使ったP2P通信)
  //
  // 合言葉から生成した固定のPeer IDを先に確保できた側がホストになる。
  // ホストがゲーム状態を管理し(サーバー役)、ゲストは操作を送るだけの
  // シンクライアントとして動作する。ホストが毎回の操作後に状態全体を
  // 送信し、ゲストはそれをそのまま画面に反映する。
  //
  // ※ 公開のPeerJSシグナリングサーバー(0.peerjs.com)を利用しているため
  //    実際の対戦にはインターネット接続が必要。自前のPeerServerを
  //    運用する場合は new Peer(id, { host, port, path }) を指定すること。
  // ============================================================

  let peer = null, conn = null, isHost = false, roomPass = '', netState = null;

  function passToPeerId(pass) {
    let h = 0;
    const s = pass.trim();
    for (let i = 0; i < s.length; i++) {
      h = (h * 31 + s.charCodeAt(i)) >>> 0;
    }
    return 'jinkai-room-' + h.toString(36);
  }

  function setOnlineStatus(text) {
    $('onlineStatus').textContent = text;
  }

  function newSidePlayer(name) {
    return { name, hp: 30, maxHp: 30, mp: 8, gold: 10, luck: 5, statuses: [], diseases: [], isDefeated: false, hand: [] };
  }

  function createInitialNetState() {
    const deck = makeDeck();
    const a = newSidePlayer('プレイヤーA(ホスト)');
    const b = newSidePlayer('プレイヤーB(ゲスト)');
    for (let i = 0; i < 4; i++) if (deck.length) a.hand.push(deck.pop());
    for (let i = 0; i < 4; i++) if (deck.length) b.hand.push(deck.pop());
    return { a, b, deck, turnOwner: 'a', turnNo: 1, gameOver: false, resultText: '', log: ['オンライン対戦を開始した。'] };
  }

  function mySide() { return isHost ? 'a' : 'b'; }
  function oppSide() { return isHost ? 'b' : 'a'; }

  function netLog(msg) {
    netState.log.push(msg);
    if (netState.log.length > 300) netState.log.shift();
  }

  function checkNetGameOver() {
    if (netState.gameOver) return true;
    const a = netState.a, b = netState.b;
    if (a.hp <= 0 || b.hp <= 0) {
      if (a.hp <= 0) a.hp = 0;
      if (b.hp <= 0) b.hp = 0;
      netState.gameOver = true;
      if (a.hp <= 0 && b.hp <= 0) netState.resultText = '引き分け';
      else if (b.hp <= 0) netState.resultText = 'プレイヤーAの勝利';
      else netState.resultText = 'プレイヤーBの勝利';
      return true;
    }
    return false;
  }

  // 以下の hostApply* はホスト側でのみ実行される「権威側」処理。
  function hostApplyPlay(side, cardIndex, targetSide) {
    const actor = netState[side];
    if (cardIndex < 0 || cardIndex >= actor.hand.length) return;
    const card = actor.hand[cardIndex];
    const t = netState[targetSide];
    const res = applyCardEffect(card, actor, t);
    netLog((side === 'a' ? 'A' : 'B') + ': ' + res.message);
    if (res.success) actor.hand.splice(cardIndex, 1);
    checkNetGameOver();
  }

  function hostApplyDraw(side) {
    const p = netState[side];
    if (netState.deck.length === 0) { netLog('山札がなくなった。'); return; }
    if (p.hand.length >= 5) { netLog((side === 'a' ? 'A' : 'B') + 'の手札は5枚。'); return; }
    p.hand.push(netState.deck.pop());
  }

  function hostApplyEndTurn(side) {
    const p = netState[side];
    if (!canAct(p)) {
      netLog((side === 'a' ? 'A' : 'B') + 'は石化していて行動できないが、ターンを終了する。');
    }
    try { processPlayerTurnEnd(p); } catch (e) {}
    if (checkNetGameOver()) return;
    const other = side === 'a' ? 'b' : 'a';
    netState.turnOwner = other;
    if (other === 'a') netState.turnNo++;
    hostApplyDraw(other);
    checkNetGameOver();
  }

  function broadcastState() {
    if (conn && conn.open) conn.send({ type: 'state', state: netState });
    renderOnline();
  }

  function handleHostData(msg) {
    if (!netState || netState.gameOver) return;
    if (!msg || msg.type !== 'action') return;
    if (netState.turnOwner !== 'b') return; // ゲストのターンでなければ無視
    if (msg.action === 'play') hostApplyPlay('b', msg.cardIndex, msg.target === 'self' ? 'b' : 'a');
    else if (msg.action === 'draw') hostApplyDraw('b');
    else if (msg.action === 'endTurn') hostApplyEndTurn('b');
    broadcastState();
  }

  function handleGuestData(msg) {
    if (!msg) return;
    if (msg.type === 'state') {
      netState = msg.state;
      renderOnline();
    } else if (msg.type === 'left') {
      setOnlineStatus('相手が退出しました。');
      renderOnline();
    }
  }

  function sendAction(action, extra) {
    if (conn && conn.open) conn.send(Object.assign({ type: 'action', action }, extra || {}));
  }

  function useCardOnline() {
    if (!netState || netState.gameOver || selectedIndex < 0) return;
    const myS = mySide();
    if (netState.turnOwner !== myS) return;
    const targetSide = target === 'self' ? myS : oppSide();
    if (isHost) {
      hostApplyPlay(myS, selectedIndex, targetSide);
      selectedIndex = -1;
      broadcastState();
    } else {
      sendAction('play', { cardIndex: selectedIndex, target });
      selectedIndex = -1;
      renderOnline();
    }
  }

  function drawOnline() {
    if (!netState || netState.gameOver) return;
    const myS = mySide();
    if (netState.turnOwner !== myS) return;
    if (isHost) { hostApplyDraw(myS); broadcastState(); }
    else sendAction('draw');
  }

  function endTurnOnline() {
    if (!netState || netState.gameOver) return;
    const myS = mySide();
    if (netState.turnOwner !== myS) return;
    if (isHost) { hostApplyEndTurn(myS); broadcastState(); }
    else sendAction('endTurn');
  }

  function renderOnline() {
    if (!netState) return;

    $('onlineInfo').classList.remove('hidden');
    $('roomLabel').textContent = roomPass;
    $('sideLabel').textContent = isHost ? 'あなた: プレイヤーA(ホスト)' : 'あなた: プレイヤーB(ゲスト)';

    const myS = mySide(), oppS = oppSide();
    const me = netState[myS], opp = netState[oppS];
    const myTurn = netState.turnOwner === myS && !netState.gameOver;

    $('playerPanel').innerHTML = renderPlayerCard(me);
    $('enemyPanel').innerHTML = renderPlayerCard(opp);
    $('turnNo').textContent = netState.turnNo;
    $('turnOwnerLabel').textContent = netState.gameOver ? '対戦終了' : (myTurn ? 'あなたのターン' : '相手のターン');

    renderHand(me.hand, selectedIndex, (i) => {
      if (!myTurn) return;
      selectedIndex = i;
      $('playBtn').disabled = false;
      renderOnline();
    }, !myTurn || netState.gameOver);

    $('targetHint').textContent = myTurn
      ? '対象: ' + (target === 'self' ? '自分' : '相手')
      : '相手の操作を待っています…';
    $('playBtn').disabled = !myTurn || selectedIndex < 0 || netState.gameOver;
    $('drawBtn').disabled = !myTurn || netState.gameOver;
    $('endBtn').disabled = !myTurn || netState.gameOver;

    const logEl = $('log');
    logEl.innerHTML = netState.log.map(m => '<div>・' + escapeHtml(m) + '</div>').join('');
    logEl.scrollTop = logEl.scrollHeight;

    if (netState.gameOver) {
      const mine = netState.resultText.includes(isHost ? 'プレイヤーA' : 'プレイヤーB');
      const draw = netState.resultText === '引き分け';
      showResult(draw ? '引き分け' : (mine ? '勝利' : '敗北'));
    } else {
      hideResult();
    }
  }

  function leaveOnline() {
    if (conn && conn.open) { try { conn.send({ type: 'left' }); } catch (e) {} }
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; conn = null; isHost = false; netState = null; roomPass = '';
    mode = 'offline';
    showScreen('modeScreen');
  }

  function connectOnline(pass) {
    roomPass = pass;
    const roomId = passToPeerId(pass);
    mode = 'online';
    setOnlineStatus('接続中…');
    $('connectBtn').disabled = true;

    peer = new Peer(roomId);

    peer.on('open', () => {
      // このIDを確保できた = 自分がホスト(先に入力した側)
      isHost = true;
      setOnlineStatus('相手の入室を待っています…(合言葉: ' + pass + ')');

      peer.on('connection', (c) => {
        conn = c;
        conn.on('data', handleHostData);
        conn.on('open', () => {
          netState = createInitialNetState();
          selectedIndex = -1;
          target = 'enemy';
          $('restartBtn').textContent = '退出';
          showScreen('gameScreen');
          broadcastState();
        });
        conn.on('close', () => setOnlineStatus('相手との接続が切れました。'));
      });
    });

    peer.on('error', (err) => {
      if (err && err.type === 'unavailable-id') {
        // 既にホストがいるのでゲストとして接続する
        isHost = false;
        const guestPeer = new Peer();
        peer = guestPeer;

        guestPeer.on('open', () => {
          conn = guestPeer.connect(roomId);
          conn.on('data', handleGuestData);
          conn.on('open', () => {
            setOnlineStatus('接続しました。');
            selectedIndex = -1;
            target = 'enemy';
            $('restartBtn').textContent = '退出';
            showScreen('gameScreen');
          });
          conn.on('close', () => setOnlineStatus('相手との接続が切れました。'));
        });

        guestPeer.on('error', (e2) => {
          setOnlineStatus('接続に失敗しました(' + e2.type + ')。合言葉を確認して再試行してください。');
          $('connectBtn').disabled = false;
        });
      } else {
        setOnlineStatus('接続エラー(' + (err && err.type) + ')。通信環境を確認して再試行してください。');
        $('connectBtn').disabled = false;
      }
    });
  }

  // ============================================================
  // 画面遷移・ボタン配線
  // ============================================================

  function onPlayBtn() { mode === 'online' ? useCardOnline() : useCard(); }
  function onDrawBtn() { if (mode === 'online') { drawOnline(); } else if (drawOne()) { log('カードを1枚引いた。'); render(); } else { render(); } }
  function onEndBtn() { mode === 'online' ? endTurnOnline() : endTurn(); }
  function onRestartBtn() { mode === 'online' ? leaveOnline() : startAiGame(); }

  $('pickAi').onclick = () => { showScreen('startScreen'); };
  $('pickOnline').onclick = () => {
    showScreen('onlineScreen');
    setOnlineStatus('');
    $('connectBtn').disabled = false;
    $('passInput').value = '';
  };
  $('backFromStart').onclick = () => showScreen('modeScreen');
  $('backFromOnline').onclick = () => showScreen('modeScreen');

  $('startBtn').onclick = startAiGame;
  $('connectBtn').onclick = () => {
    const pass = $('passInput').value.trim();
    if (!pass) { alert('合言葉を入力してください。'); return; }
    connectOnline(pass);
  };

  $('playBtn').onclick = onPlayBtn;
  $('drawBtn').onclick = onDrawBtn;
  $('endBtn').onclick = onEndBtn;
  $('restartBtn').onclick = onRestartBtn;
  $('targetSelf').onclick = () => { target = 'self'; mode === 'online' ? renderOnline() : render(); };
  $('targetEnemy').onclick = () => { target = 'enemy'; mode === 'online' ? renderOnline() : render(); };

  showScreen('modeScreen');
})();
</script>
</body>
</html>
